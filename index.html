<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="写真マップ">
  <title>写真マップ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <form id="search" role="search">
      <input id="q" type="search" placeholder="場所を入力 例：本部町" enterkeyhint="search" autocomplete="off">
    </form>
    <button id="undo" type="button" hidden>↩戻す</button>
    <label class="add" for="pick">＋写真</label>
    <input id="pick" type="file" accept="image/*" multiple>
  </header>

  <div class="map-wrap">
    <main id="map"></main>
    <div id="playCard" hidden>
      <div class="play-frame"><img id="playImg" alt=""></div>
      <p id="playTime"></p>
    </div>
    <button id="play" type="button" hidden>▶再生</button>
  </div>

  <footer>
    <div id="days" class="days"></div>
    <section id="results" hidden>
      <div class="results-head">
        <b id="resultsTitle"></b>
        <button id="backToDays" type="button">日付一覧に戻る</button>
      </div>
      <ul id="resultsList"></ul>
    </section>
  </footer>

  <div id="viewer" hidden>
    <button id="viewerClose" type="button" aria-label="閉じる">×</button>
    <img id="viewerImg" alt="">
    <p id="viewerTime"></p>
  </div>

  <div id="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
